name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  COVERAGE_THRESHOLD: 80

jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [lint]
    strategy:
      matrix:
        node: [20, 22] # тестируем на нескольких версиях
      fail-fast: false
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      coverage_status: ${{ steps.coverage.outputs.coverage_status }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage (only for Node 22)
        id: coverage
        if: matrix.node == env.NODE_VERSION
        run: |
          npm run test:coverage
          # Предположим, coverage summary лежит в coverage/coverage-summary.json
          COVERAGE=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "Coverage: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT

          if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
            echo "coverage_status=warning" >> $GITHUB_OUTPUT
            echo "⚠️ Coverage below threshold"
          else
            echo "coverage_status=passed" >> $GITHUB_OUTPUT
            echo "✅ Coverage passed"
          fi

          # Summary
          echo "## 🧪 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | **${COVERAGE}%** |" >> $GITHUB_STEP_SUMMARY
          echo "| Threshold | ${{ env.COVERAGE_THRESHOLD }}% |" >> $GITHUB_STEP_SUMMARY

      - name: Run tests (no coverage) for other Node versions
        if: matrix.node != env.NODE_VERSION
        run: npm run test

      - name: Upload coverage artifact
        if: matrix.node == env.NODE_VERSION && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  build:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run size || echo "⚠️ Bundle size warning"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 30

  comment:
    runs-on: ubuntu-24.04
    needs: [lint, test, build]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Comment PR on success
        if: needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ needs.test.outputs.coverage }}';
            const coverageStatus = coverage ? `📊 Code coverage: ${coverage}%` : '📊 Coverage data not available';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **CI passed successfully!**\n\n` +
                    `| Check | Status |\n` +
                    `|-------|--------|\n` +
                    `| Linting | ✅ Passed |\n` +
                    `| Build | ✅ Passed |\n` +
                    `| Tests | ✅ Passed |\n` +
                    `| ${coverageStatus} | ✅ |\n\n` +
                    `📦 **Build artifact:** \`build-${{ github.sha }}\`\n` +
                    `🔍 **Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n` +
                    `✨ *Ready for review!*`
            })

      - name: Comment PR on failure
        if: needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure'
        uses: actions-cool/maintain-one-comment@v3
        with:
          body: |
            ❌ **CI failed**

            | Check | Status |
            |-------|--------|
            | Linting | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |
            | Tests | ${{ needs.test.result == 'success' && '✅' || '❌' }} |
            | Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} |

            🔍 **Details:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please check the logs and fix the issues.

  coverage-warning:
    runs-on: ubuntu-24.04
    needs: [test]
    if: always() && github.event_name == 'pull_request' && needs.test.outputs.coverage_status == 'warning'
    steps:
      - name: Comment coverage warning
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **Coverage Warning**\n\n` +
                    `Code coverage is **${{ needs.test.outputs.coverage }}%**, which is below the threshold of **${{ env.COVERAGE_THRESHOLD }}%**.\n\n` +
                    `Please consider adding more tests to improve coverage.`
            })
