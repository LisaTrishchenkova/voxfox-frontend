name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  COVERAGE_THRESHOLD: 80 # Только для информации, не для падения

jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: |
          if npm audit --audit-level=high 2>&1 | grep -q "found.*high"; then
            echo "⚠️ Found high severity vulnerabilities!"
            npm audit --audit-level=high
            # Не падаем, только предупреждаем
          else
            echo "✅ No high severity vulnerabilities"
          fi

      - name: Run linter
        run: npm run lint
        # Предупреждения не вызывают падения

      - name: Type check
        run: npm run type-check
        # Ошибки типов все еще вызывают падение (это критично)

  test:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    needs: [lint]
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      coverage_status: ${{ steps.coverage.outputs.coverage_status }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: coverage
        run: |
          # Запускаем тесты с покрытием (не падаем из-за низкого покрытия)
          npm run test:coverage || true

          if [ -f "coverage/coverage-summary.json" ]; then
            COVERAGE=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct.toFixed(2)")
            echo "coverage=${COVERAGE}" >> $GITHUB_OUTPUT
            echo "📊 Coverage: ${COVERAGE}%"

            # Только предупреждение, не падаем
            if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "coverage_status=warning" >> $GITHUB_OUTPUT
              echo "⚠️ Coverage ${COVERAGE}% is below recommended threshold ${{ env.COVERAGE_THRESHOLD }}%"
            else
              echo "coverage_status=passed" >> $GITHUB_OUTPUT
              echo "✅ Coverage ${COVERAGE}% meets recommended threshold"
            fi

            # Создаем summary
            echo "## 🧪 Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Coverage | **${COVERAGE}%** |" >> $GITHUB_STEP_SUMMARY
            echo "| Recommended | ${{ env.COVERAGE_THRESHOLD }}% |" >> $GITHUB_STEP_SUMMARY

            if [ "$COVERAGE_STATUS" = "warning" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Note:** Current coverage is below the recommended threshold. Consider adding more tests." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Coverage summary not found"
            echo "coverage=unknown" >> $GITHUB_OUTPUT
            echo "coverage_status=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  build:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          npm run size

          echo "## 📦 Bundle Size" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm run size -- --silent >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 7

  comment:
    runs-on: ubuntu-24.04
    needs: [lint, test, build]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Generate status message
        id: status
        run: |
          if [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ]; then
            echo "overall=success" >> $GITHUB_OUTPUT
          else
            echo "overall=failure" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR on success
        if: steps.status.outputs.overall == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ needs.test.outputs.coverage }}';
            const coverageWarning = '${{ needs.test.outputs.coverage_status }}' === 'warning' ? ' ⚠️' : '';

            let message = `## ✅ CI Passed\n\n`;
            message += `| Check | Status |\n`;
            message += `|-------|--------|\n`;
            message += `| Lint & Type Check | ✅ |\n`;
            message += `| Tests | ✅ |\n`;
            message += `| Coverage | ${coverage}%${coverageWarning} |\n`;
            message += `| Build | ✅ |\n\n`;

            if (coverageWarning) {
              message += `⚠️ **Note:** Coverage is below the recommended threshold of ${{ env.COVERAGE_THRESHOLD }}%. Consider adding more tests to improve coverage.\n\n`;
            }

            message += `🔍 [View details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Comment PR on failure
        if: steps.status.outputs.overall == 'failure'
        uses: actions-cool/maintain-one-comment@v3
        with:
          body: |
            ## ❌ CI Failed

            | Check | Status |
            |-------|--------|
            | Lint & Type Check | ${{ needs.lint.result == 'success' && '✅' || '❌' }} |
            | Tests | ${{ needs.test.result == 'success' && '✅' || '❌' }} |
            | Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} |

            🔍 [View details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Please check the logs and fix the issues.
