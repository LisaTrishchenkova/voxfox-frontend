name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.2.3)"
        required: true
        type: string
      confirm:
        description: "Type YES to confirm prod deployment"
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'YES' }}
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.version.outputs.tag }}

    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.confirm }}" != "YES" ]; then
            echo "❌ Type exactly YES to confirm"
            exit 1
          fi

          if [[ ! "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag must be format v1.2.3, got: ${{ inputs.tag }}"
            exit 1
          fi

          echo "✅ Inputs valid, deploying ${{ inputs.tag }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Extract version
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          cat > .env << EOF
          VITE_APP_VERSION=${{ steps.version.outputs.tag }}
          VITE_COMMIT_HASH=${{ steps.version.outputs.short_sha }}
          VITE_BUILD_DATE=${{ steps.version.outputs.build_date }}
          VITE_API_URL=${{ vars.VITE_API_URL_PROD }}
          EOF

          cat > version.json << EOF
          {
            "version": "${{ steps.version.outputs.tag }}",
            "commit": "${{ steps.version.outputs.short_sha }}",
            "buildTime": "${{ steps.version.outputs.build_date }}",
            "environment": "production"
          }
          EOF

          npm run build
          cp version.json dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_PROD }}

      - name: Get current version
        id: current
        run: |
          CURRENT=$(aws s3 cp s3://${{ vars.S3_BUCKET_PROD }}/meta/current-version.txt - 2>/dev/null || echo "none")
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT
          echo "📦 Current: ${CURRENT}"

      - name: Deploy to S3
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BUCKET="${{ vars.S3_BUCKET_PROD }}"

          aws s3 sync dist/ s3://${BUCKET}/archive/${TAG}/ --only-show-errors

          cat > manifest.json << EOF
          {
            "version": "${VERSION}",
            "deployedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit": "${{ steps.version.outputs.short_sha }}",
            "deployedBy": "${{ github.actor }}",
            "previousVersion": "${CURRENT}",
            "runId": "${{ github.run_id }}",
            "environment": "production",
            "approvedBy": "${{ github.actor }}"
          }
          EOF
          aws s3 cp manifest.json s3://${BUCKET}/archive/${TAG}/manifest.json

          aws s3 sync dist/ s3://${BUCKET}/current/ --delete

          echo "${TAG}" > current-version.txt
          aws s3 cp current-version.txt s3://${BUCKET}/meta/current-version.txt
          echo "${{ steps.current.outputs.current }}" > previous-version.txt
          aws s3 cp previous-version.txt s3://${BUCKET}/meta/previous-version.txt

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_PROD }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text

      - name: Verify deployment
        run: |
          sleep 15
          DEPLOYED=$(curl -sf https://${{ vars.CLOUDFRONT_DOMAIN_PROD }}/version.json | jq -r '.version')
          if [ "${DEPLOYED}" == "${{ steps.version.outputs.tag }}" ]; then
            echo "✅ Verified: ${DEPLOYED}"
          else
            echo "❌ Mismatch! Expected ${{ steps.version.outputs.tag }}, got ${DEPLOYED}"
            exit 1
          fi

      - name: Auto-rollback on failure
        if: failure()
        run: |
          PREV="${{ steps.current.outputs.current }}"
          if [ "${PREV}" != "none" ] && [ -n "${PREV}" ]; then
            echo "🔄 Rolling back to ${PREV}"
            aws s3 sync s3://${{ vars.S3_BUCKET_PROD }}/archive/${PREV}/ \
                        s3://${{ vars.S3_BUCKET_PROD }}/current/ --delete
            aws cloudfront create-invalidation \
              --distribution-id ${{ secrets.CLOUDFRONT_DIST_PROD }} --paths "/*"
            echo "✅ Rolled back to ${PREV}"
          else
            echo "⚠️ No previous version to rollback to"
          fi

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Production deployed: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
            echo "**By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
            echo "**Previous:** ${{ steps.current.outputs.current }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Production deployment FAILED" >> $GITHUB_STEP_SUMMARY
            echo "**Rollback triggered to:** ${{ steps.current.outputs.current }}" >> $GITHUB_STEP_SUMMARY
          fi
