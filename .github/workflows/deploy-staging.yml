name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging' }}
    environment: staging
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          VERSION="${TIMESTAMP}-${SHORT_SHA}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build app with version
        run: |
          # Create .env for build
          cat > .env << EOF
          VITE_APP_VERSION=${{ steps.version.outputs.version }}
          VITE_COMMIT_HASH=${{ steps.version.outputs.short_sha }}
          VITE_BUILD_DATE=${{ steps.version.outputs.build_date }}
          VITE_API_URL=${{ vars.VITE_API_URL_STAGING }}
          EOF

          # Create version.json
          cat > version.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "commit": "${{ steps.version.outputs.short_sha }}",
            "buildTime": "${{ steps.version.outputs.build_date }}",
            "environment": "staging"
          }
          EOF

          npm run build
          cp version.json dist/
          echo "✅ Build complete: $(du -sh dist/)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}

      - name: Get current version
        id: current
        run: |
          CURRENT=$(aws s3 cp s3://${{ vars.S3_BUCKET }}/meta/current-version.txt - 2>/dev/null || echo "none")
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT
          echo "📦 Current version: ${CURRENT}"

      - name: Deploy to S3
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="${{ vars.S3_BUCKET }}"
          CURRENT="${{ steps.current.outputs.current }}"

          aws s3 sync dist/ s3://${BUCKET}/archive/${VERSION}/ --only-show-errors

          cat > manifest.json << EOF
          {
            "version": "${VERSION}",
            "deployedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit": "${{ steps.version.outputs.short_sha }}",
            "deployedBy": "${{ github.actor }}",
            "previousVersion": "${CURRENT}",
            "runId": "${{ github.run_id }}",
            "environment": "staging"
          }
          EOF
          aws s3 cp manifest.json s3://${BUCKET}/archive/${VERSION}/manifest.json

          aws s3 sync dist/ s3://${BUCKET}/current/ --delete

          echo "${VERSION}" > current-version.txt
          aws s3 cp current-version.txt s3://${BUCKET}/meta/current-version.txt
          echo "${CURRENT}" > previous-version.txt
          aws s3 cp previous-version.txt s3://${BUCKET}/meta/previous-version.txt

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "✅ CloudFront invalidation: ${INVALIDATION_ID}"

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for CloudFront (10s)..."
          sleep 10

          VERSION_URL="https://${{ vars.CLOUDFRONT_DOMAIN }}/version.json"
          echo "Checking ${VERSION_URL}"

          DEPLOYED_VERSION=$(curl -s -f ${VERSION_URL} | jq -r '.version' || echo "failed")

          if [ "${DEPLOYED_VERSION}" == "${{ steps.version.outputs.version }}" ]; then
            echo "✅ Version verified: ${DEPLOYED_VERSION}"
          else
            echo "❌ Version mismatch! Expected: ${{ steps.version.outputs.version }}, Got: ${DEPLOYED_VERSION}"
            exit 1
          fi

      - name: Notify success
        if: success()
        uses: actions-cool/maintain-one-comment@v3
        with:
          body: |
            🚀 **Deployed to Staging successfully!**               # ✅ staging!

            **Version:** `${{ steps.version.outputs.version }}`
            **Branch:** `staging`
            **Commit:** [`${{ steps.version.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }})
            **Previous version:** `${{ steps.current.outputs.current }}`

            🔗 **Links:**
            • 🌐 **Staging:** https://${{ vars.CLOUDFRONT_DOMAIN }}
            • 📦 **Archive:** s3://${{ vars.S3_BUCKET }}/archive/${{ steps.version.outputs.version }}
            • 🔍 **Version.json:** https://${{ vars.CLOUDFRONT_DOMAIN }}/version.json

            [View deployment run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Auto-rollback on failure
        if: failure()
        run: |
          PREV_VERSION="${{ steps.current.outputs.current }}"
          if [ "${PREV_VERSION}" != "none" ] && [ ! -z "${PREV_VERSION}" ]; then
            echo "🔄 Auto-rolling back to ${PREV_VERSION}"
            aws s3 sync s3://${{ vars.S3_BUCKET }}/archive/${PREV_VERSION}/ s3://${{ vars.S3_BUCKET }}/current/ --delete
            aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST }} --paths "/*"
            echo "✅ Rolled back to ${PREV_VERSION}"
          fi

      - name: Notify failure
        if: failure()
        uses: actions-cool/maintain-one-comment@v3
        with:
          body: |
            ❌ **Deploy to Staging failed!**

            **Version:** `${{ steps.version.outputs.version }}`
            **Branch:** `staging`
            **Commit:** [`${{ steps.version.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }})

            **Rollback:** ${{ steps.current.outputs.current != 'none' && '🔄 Auto-rollback triggered' || '⚠️ No previous version' }}

            [View failed run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
